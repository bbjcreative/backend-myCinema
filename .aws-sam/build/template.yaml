AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Deploys the myCinemaz movie scraper application, including a Lambda
  function and an S3 bucket to store the scraped data and posters.

  '
Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: movie-scraper-data-${AWS::AccountId}
  ScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: myCinemaz-scraper
      CodeUri: ScraperFunction
      Handler: lambda_function.lambda_handler
      Runtime: python3.11
      Timeout: 900
      MemorySize: 256
      Environment:
        Variables:
          S3_BUCKET_NAME:
            Ref: DataBucket
      Policies:
      - S3WritePolicy:
          BucketName:
            Ref: DataBucket
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)
            Name: DailyMovieScrapeTrigger
            Description: Triggers the movie scraper function daily.
            Enabled: true
    Metadata:
      SamResourceId: ScraperFunction
Outputs:
  BucketName:
    Description: The name of the S3 bucket for storing movie data and posters.
    Value:
      Ref: DataBucket
